name: OpenAPI Drift

# Compares the live backend's /openapi.json against the checked-in snapshot the
# API types are generated from (openapi/openapi.json). A failure means the
# backend's contract moved and the generated types no longer describe
# production — refresh with:
#
#   (in backend)   .venv/bin/python scripts/export_openapi.py > ../frontend/openapi/openapi.json
#   (in frontend)  bun run generate:api    # then fix whatever the typecheck surfaces
#
# Since 2026-09-06 Railway deploys production on any push/merge to main, so a
# backend schema change reaches production within minutes of merging and the
# frontend regen should follow it straight away. There is no longer a nightly
# window to wait out, so a failure here is a real mismatch rather than a deploy
# lag. No secrets: /openapi.json is public.

on:
  schedule:
    - cron: "30 8 * * *" # daily; the hour is historical — deploys are no longer batched
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff live schema against the snapshot
        run: |
          curl -fsS https://api.courtvision.dev/openapi.json | jq -S . > /tmp/live.json
          jq -S . openapi/openapi.json > /tmp/snapshot.json
          if ! diff -u /tmp/snapshot.json /tmp/live.json > /tmp/schema.diff; then
            echo "::error::Live /openapi.json has drifted from openapi/openapi.json — regenerate the snapshot and types (see workflow header)."
            head -100 /tmp/schema.diff
            exit 1
          fi
          echo "Snapshot matches production."
